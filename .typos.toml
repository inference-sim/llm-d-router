[default.extend-words]
k8s = "k8s"
KServe = "KServe"
vLLM = "vLLM"
IST = "IST"
# American English (Go stdlib uses Unmarshal)
unmarshaling = "unmarshaling"
# image_grid_thw is a vLLM/CUDA tensor shape parameter
thw = "thw"

[files]
extend-exclude = [
    "*.png",
    "*.jpg",
    "deploy/",
    "go.mod",
    "go.sum",
    "build/",
    "testdata/",
    # Generated CRDs; controller-gen embeds upstream Kubernetes API descriptions
    "config/crd/bases/",
    # The fork's embedded copy of those CRDs, byte for byte
    "pkg/embed/crds/",
    # Generated protobuf files
    "pkg/epp/framework/plugins/requesthandling/parsers/vllmgrpc/api/gen/",
]

