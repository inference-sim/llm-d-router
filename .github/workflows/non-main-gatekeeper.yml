name: Label non-main PRs

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  add-label:
    runs-on: ubuntu-latest
    steps:
      - name: Add labels when base branch is not main
        # llm-d-r is the inference-sim fork's long-lived hosting branch; PRs into it are its normal flow.
        # So are PRs into an m3/ integration branch: the fork's item pull requests are merged there
        # by the integrator, and a hold label would turn the Hold gate red on every one of them.
        if: >-
          github.event.pull_request.base.ref != 'main' &&
          github.event.pull_request.base.ref != 'llm-d-r' &&
          !startsWith(github.event.pull_request.base.ref, 'm3/')
        uses: actions-ecosystem/action-add-labels@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          labels: |
            do-not-merge/hold
